<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4ead0" />
  <title>Bamboo Cicada · 任意网页里的竹知了</title>
  <style>
    :root { color: #26352c; background: #f5ead0; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 10%, #fff9e9 0 14%, transparent 32%), #f5ead0; }
    main { width: min(68rem, calc(100% - 2rem)); min-height: 100vh; margin: auto; display: grid; grid-template-columns: 1fr minmax(18rem, 23rem); gap: clamp(2rem, 7vw, 7rem); align-items: center; padding: 3rem 0; }
    .eyebrow { color: #b45737; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 10ch; margin: .7rem 0 1.2rem; font-size: clamp(3rem, 7vw, 6.3rem); line-height: .93; letter-spacing: -.055em; }
    .lead { max-width: 31rem; color: #526257; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.75; }
    code { display: block; width: fit-content; max-width: 100%; margin-top: 1.8rem; padding: .9rem 1rem; overflow-x: auto; border: 1px solid #26352c1a; border-radius: .8rem; background: #fff8e7b8; color: #81472f; font: 600 .78rem/1.6 ui-monospace, monospace; white-space: nowrap; }
    .features { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
    .features span { padding: .45rem .7rem; border-radius: 99rem; background: #dfe8c9; font-size: .75rem; font-weight: 700; }
    .demo { justify-self: end; width: 100%; filter: drop-shadow(0 2rem 2rem rgba(65, 78, 42, .12)); }
    bamboo-cicada { width: 100%; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; padding-top: 4rem; } h1 { max-width: none; } .demo { justify-self: center; width: min(100%, 22rem); } }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="eyebrow">Bamboo Cicada · 0 dependencies</div>
      <h1>把童年的声音，甩回网页里。</h1>
      <p class="lead">一个轻量、可嵌入、样式完全隔离的 JavaScript 竹知了。按住画圈，转速会驱动运动、音高和音量；也可以点自动按钮偷个懒。</p>
      <code>&lt;bamboo-cicada label="转起来"&gt;&lt;/bamboo-cicada&gt;</code>
      <div class="features"><span>Web Component</span><span>Web Audio</span><span>触屏优先</span><span>无素材请求</span></div>
    </section>
    <div class="demo"><bamboo-cicada label="转起来"></bamboo-cicada></div>
  </main>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
